<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  
  <title>四问破题｜独立填写</title>
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body class="sheet-page" data-mode="static" data-slug="four-questions" data-submit-url="">
  <main class="sheet-app">
    <header class="sheet-page-header">
      <div>
        <a class="back-link" href="../index.html">← 返回表格目录</a>
        <h1>四问破题</h1>
        <p>① 破｜四问破题</p>
      </div>
    </header>

    <form id="sheetForm" novalidate>
      <section class="workbook" aria-label="① 破｜四问破题 Excel 工作表">
        <div class="workbook-bar">
          <span class="workbook-icon" aria-hidden="true">▱</span>
          <strong>Sheet1</strong>
          <div class="zoom-controls" role="group" aria-label="表格缩放">
            <button id="zoomOutButton" type="button" aria-label="缩小表格">－</button>
            <output id="zoomLevel" aria-live="polite">100%</output>
            <button id="zoomInButton" type="button" aria-label="放大表格">＋</button>
            <button id="fitButton" class="fit-button" type="button">适应屏幕</button>
          </div>
          <span class="workbook-hint">可左右滑动或双指缩放 · 草稿自动保存</span>
        </div>
        <div class="sheet-scroll">
          <table class="excel-grid">
            <colgroup>
              <col class="row-number-column">
              <col style="width:13.2505%"><col style="width:14.4582%"><col style="width:14.4582%"><col style="width:14.4582%"><col style="width:14.4582%"><col style="width:14.4582%"><col style="width:14.4582%">
            </colgroup>
            <thead>
              <tr>
                <th class="sheet-corner" aria-hidden="true"></th>
                <th scope="col">A</th><th scope="col">B</th><th scope="col">C</th><th scope="col">D</th><th scope="col">E</th><th scope="col">F</th><th scope="col">G</th>
              </tr>
            </thead>
            <tbody>
              
              <tr style="height:39.3px">
                <th class="row-number" scope="row">1</th>
                
                <td
                  class="static-cell"
                  
                  colspan="7"
                  style="background-color:#D9EAF7;font-weight:700;font-size:14.2px;text-align:center;vertical-align:center"
                  data-coordinate="A1"
                >
                  
                    <span class="cell-text">① 破｜四问破题</span>
                  
                </td>
                
              </tr>
              
              <tr style="height:45.3px">
                <th class="row-number" scope="row">2</th>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;font-weight:700;font-size:13.0px;text-align:center;vertical-align:center"
                  data-coordinate="A2"
                >
                  
                    <span class="cell-text">事实</span>
                  
                </td>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;color:#666666;font-style:italic;font-size:10.6px;vertical-align:center"
                  data-coordinate="C2"
                >
                  
                    <span class="cell-text">已经客观发生、可以确认的是什么？</span>
                  
                </td>
                
                <td
                  class="field-cell"
                  
                  colspan="3"
                  style="vertical-align:center"
                  data-coordinate="E2"
                >
                  
                    
                    <textarea
                      name="fact"
                      aria-label="事实"
                      maxlength="1200"
                      required
                    ></textarea>
                    <small class="field-error" data-error-for="fact"></small>
                  
                </td>
                
              </tr>
              
              <tr style="height:45.3px">
                <th class="row-number" scope="row">3</th>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;font-weight:700;font-size:13.0px;text-align:center;vertical-align:center"
                  data-coordinate="A3"
                >
                  
                    <span class="cell-text">约束</span>
                  
                </td>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;color:#666666;font-style:italic;font-size:10.6px;vertical-align:center"
                  data-coordinate="C3"
                >
                  
                    <span class="cell-text">当前必须面对、不能忽略的条件是什么？</span>
                  
                </td>
                
                <td
                  class="field-cell"
                  
                  colspan="3"
                  style="font-size:13.0px;vertical-align:center"
                  data-coordinate="E3"
                >
                  
                    
                    <textarea
                      name="constraint"
                      aria-label="约束"
                      maxlength="1200"
                      required
                    ></textarea>
                    <small class="field-error" data-error-for="constraint"></small>
                  
                </td>
                
              </tr>
              
              <tr style="height:45.3px">
                <th class="row-number" scope="row">4</th>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;font-weight:700;font-size:13.0px;text-align:center;vertical-align:center"
                  data-coordinate="A4"
                >
                  
                    <span class="cell-text">假设</span>
                  
                </td>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;color:#666666;font-style:italic;font-size:10.6px;vertical-align:center"
                  data-coordinate="C4"
                >
                  
                    <span class="cell-text">哪些只是习惯性认为“必须如此”？
可追问：为什么必须这样？</span>
                  
                </td>
                
                <td
                  class="field-cell"
                  
                  colspan="3"
                  style="font-size:13.0px;vertical-align:center"
                  data-coordinate="E4"
                >
                  
                    
                    <textarea
                      name="assumption"
                      aria-label="假设"
                      maxlength="1200"
                      required
                    ></textarea>
                    <small class="field-error" data-error-for="assumption"></small>
                  
                </td>
                
              </tr>
              
              <tr style="height:45.3px">
                <th class="row-number" scope="row">5</th>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;font-weight:700;font-size:13.0px;text-align:center;vertical-align:center"
                  data-coordinate="A5"
                >
                  
                    <span class="cell-text">重构</span>
                  
                </td>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#F4F9FD;color:#666666;font-style:italic;font-size:10.6px;vertical-align:center"
                  data-coordinate="C5"
                >
                  
                    <span class="cell-text">去掉默认假设，问题还能怎么问？</span>
                  
                </td>
                
                <td
                  class="field-cell"
                  
                  colspan="3"
                  style="font-size:13.0px;vertical-align:center"
                  data-coordinate="E5"
                >
                  
                    
                    <textarea
                      name="reframe"
                      aria-label="重构"
                      maxlength="1200"
                      required
                    ></textarea>
                    <small class="field-error" data-error-for="reframe"></small>
                  
                </td>
                
              </tr>
              
              <tr style="height:45.3px">
                <th class="row-number" scope="row">6</th>
                
                <td
                  class="static-cell"
                  
                  colspan="2"
                  style="background-color:#D9EAF7;font-weight:700;font-size:13.0px;text-align:center;vertical-align:center"
                  data-coordinate="A6"
                >
                  
                    <span class="cell-text">破题结果</span>
                  
                </td>
                
                <td
                  class="field-cell"
                  
                  colspan="5"
                  style="font-size:13.0px;vertical-align:center"
                  data-coordinate="C6"
                >
                  
                    <span class="cell-prefix">我真正值得解决的问题是：</span>
                    <textarea
                      name="result"
                      aria-label="破题结果"
                      maxlength="1600"
                      required
                    ></textarea>
                    <small class="field-error" data-error-for="result"></small>
                  
                </td>
                
              </tr>
              
            </tbody>
          </table>
        </div>
        <div class="sheet-tabs" aria-hidden="true"><span>▱</span><strong>Sheet1</strong><b>＋</b></div>
      </section>

      <div class="action-bar">
        <p id="saveStatus" aria-live="polite">草稿尚未填写</p>
        <div class="action-buttons">
          <button class="secondary-button" id="clearButton" type="button">清空</button>
          <button class="secondary-button" id="printButton" type="button">打印/保存PDF</button>
          <button class="primary-button" id="submitButton" type="submit">
            <span>完成填写</span><b aria-hidden="true">✓</b>
          </button>
        </div>
      </div>
    </form>
  </main>

  <div id="successModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="successTitle">
      <div class="success-mark">✓</div>
      <p class="modal-kicker">填写完成</p>
      <h2 id="successTitle">内容已保存在当前设备</h2>
      <p id="successMessage">
        本页没有向教师或后台上传数据。关闭前可截图或打印保存。
      </p>
      <div class="code-box"><span>完成时间</span><strong id="resultCode"></strong></div>
      <button class="primary-button modal-close" type="button" id="closeModal">返回查看</button>
    </div>
  </div>

  <script src="../assets/form.js" defer></script>
</body>
</html>
